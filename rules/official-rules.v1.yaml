schema_version: "1.0"
ruleset_id: rentproof-tw-rental-rules
ruleset_version: 1.0.0-draft
jurisdiction: TW
verified_at: "2026-09-01T00:00:00+08:00"
disclaimer: >-
  These rules surface possible textual or numerical differences for human review.
  They do not determine legality, validity, fraud, liability, or case outcomes.

allowed_results:
  - no_difference_found
  - possible_difference
  - missing_information

evaluation_policy:
  applicability_values: [applicable, not_applicable, unknown]
  unknown_applicability_result: missing_information
  not_applicable_behavior: create_skipped_rule_check_with_null_result
  unknown_required_input_result: missing_information
  scope_gate: case.general_residential_scope must be confirmed true
  source_resolution: resolve source_id to URL and persist rule locator, ruleset version, and source snapshot SHA-256 in every RuleCheck
  draft_promotion_gate: every source must have a frozen snapshot SHA-256 before this ruleset is production-ready
  execution: evaluator_id maps to an allowlisted TypeScript function; never eval predicate text from YAML
  predicate_fields: documentation_only
  date_gate: every evaluator applies effective_date to case.intended_signed_at before rule-specific logic
  result_precedence: possible_difference_then_no_difference_if_complete_else_missing_information

profiles:
  p0:
    active_rule_ids: [RP-003, RP-004, RP-006, RP-008, RP-009, RP-010]
  p1:
    active_rule_ids:
      [RP-001, RP-002, RP-003, RP-004, RP-005, RP-006, RP-007, RP-008, RP-009, RP-010]
    added_after_p0: [RP-001, RP-002, RP-005, RP-007]

